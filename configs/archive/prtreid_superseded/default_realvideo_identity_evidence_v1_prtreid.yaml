base_config: ../../default_realvideo_identity_evidence_v1.yaml

visual:
  embedding_mode: prtreid

linking:
  appearance_min_similarity: 0.55

prtreid:
  enabled: true
  weights_path: models/reid/prtreid-soccernet-baseline.pth.tar
  hrnet_pretrained_path: models/reid
  device: auto
  batch_size: 32
  image_width: 128
  image_height: 256
  test_embeddings: ["globl"]
  download_weights: false
  role_enabled: true
  role_min_confidence: 0.60
  role_protect_existing: true

team:
  assignment_mode: prtreid_kmeans

identity_propagation:
  min_appearance_similarity: 0.45
  strong_appearance_similarity: 0.75
