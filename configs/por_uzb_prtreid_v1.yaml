base_config: best_known_int_ata_number_region_scene_reset_control.yaml

# Enable PRTReID for real (deep soccer-specific ReID embeddings, HSV-histogram
# is the default otherwise). Both keys are required: prtreid.enabled alone is
# not enough -- visual.embedding_mode must also be switched to "prtreid",
# otherwise the pipeline logs "PRTReID will not run" and silently keeps HSV.
# Same prtreid block already used for Int-Ata/Inter-Juve/Inter-Atalanta.
visual:
  embedding_mode: prtreid

prtreid:
  enabled: true
  weights_path: models/reid/prtreid-soccernet-baseline.pth.tar
  hrnet_pretrained_path: models/reid
  device: auto
  batch_size: 32
  image_width: 128
  image_height: 256
  test_embeddings: ["globl"]
  download_weights: false
  role_enabled: false
  role_min_confidence: 0.6
  role_protect_existing: true
