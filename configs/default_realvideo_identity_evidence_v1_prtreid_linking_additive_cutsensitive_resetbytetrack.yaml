base_config: default_realvideo_identity_evidence_v1.yaml

# Match the stable reset-at-cut baseline. PRTReID is used only to build
# prototypes for the additive second linker; it must not alter the legacy
# appearance linker, downstream visual descriptor, team assignment, or roles.
scene_cuts:
  enabled: true
  tracking_reset_enabled: true
  threshold: 0.08
  hard_cut_threshold: 0.12
  min_gap: 40

visual:
  embedding_mode: hsv_lab_gradient

team:
  assignment_mode: color

prtreid:
  enabled: true
  weights_path: models/reid/prtreid-soccernet-baseline.pth.tar
  hrnet_pretrained_path: models/reid
  device: auto
  batch_size: 32
  image_width: 128
  image_height: 256
  test_embeddings: ["globl"]
  download_weights: false
  role_enabled: false

prtreid_linking:
  enabled: true
  max_samples_per_tracklet: 8
  min_crop_quality: 0.15
  min_samples: 3
  min_prototype_consistency: 0.90
  require_team_match: true
  min_team_confidence: 0.55
  same_scene:
    enabled: true
    max_gap: 180
    max_distance: 220.0
    min_similarity: 0.99
    min_margin: 0.01
    mutual_nearest: true
  cross_scene:
    enabled: false
    max_segment_gap: 1
    max_gap: 60
    min_similarity: 0.995
    min_margin: 0.02
    mutual_nearest: true

identity_propagation:
  enabled: false
